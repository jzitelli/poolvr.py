<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>poolvr.py</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: monospace; }
    #app { width: 100%; height: 100%; }
    canvas { display: block; }
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #eee;
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      pointer-events: none;
      z-index: 10;
    }
    #speed-control {
      position: fixed;
      bottom: 50px;
      right: 10px;
      color: #eee;
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #speed-slider {
      width: 100px;
      accent-color: #4caf50;
    }
    #power-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 12px;
      background: rgba(0,0,0,0.5);
      border-radius: 6px;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
    }
    #power-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4caf50, #ff9800, #f44336);
      transition: width 0.05s;
      border-radius: 6px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud">Loading...</div>
  <div id="speed-control">
    <label for="speed-slider">Speed:</label>
    <input type="range" id="speed-slider" min="0.1" max="3" step="0.1" value="1">
    <span id="speed-value">1.0x</span>
  </div>
  <div id="power-bar" style="display:none"><div id="power-fill"></div></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
